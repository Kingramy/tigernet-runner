name: Tigernet Algeria Live Surveillance

on:
  push:
    branches:
      - main
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tigernet-surveillance
  cancel-in-progress: false

jobs:
  surveillance:
    name: Run Satellite Surveillance Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read

    steps:
      - name: Checkout Public Runner Repository
        uses: actions/checkout@v7

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Secrets Configuration
        env:
          TIGERNET_PRIVATE_TOKEN: ${{ secrets.TIGERNET_PRIVATE_TOKEN }}
          TIGERNET_STATE_TOKEN: ${{ secrets.TIGERNET_STATE_TOKEN }}
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: |
          MISSING=""
          if [ -z "$TIGERNET_PRIVATE_TOKEN" ]; then
            MISSING="${MISSING} TIGERNET_PRIVATE_TOKEN"
          fi
          if [ -z "$TIGERNET_STATE_TOKEN" ]; then
            MISSING="${MISSING} TIGERNET_STATE_TOKEN"
          fi
          if [ -z "$EUMETSAT_CONSUMER_KEY" ]; then
            MISSING="${MISSING} EUMETSAT_CONSUMER_KEY"
          fi
          if [ -z "$EUMETSAT_CONSUMER_SECRET" ]; then
            MISSING="${MISSING} EUMETSAT_CONSUMER_SECRET"
          fi
          
          if [ -n "${MISSING}" ]; then
            echo "::error::Missing required repository secrets:${MISSING}."
            echo "Please configure the missing secrets in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required secret references are securely present."

      - name: Securely Retrieve Private Inference Engine
        uses: actions/checkout@v7
        with:
          repository: Kingramy/tigernet
          ref: main
          token: ${{ secrets.TIGERNET_PRIVATE_TOKEN }}
          path: _engine
          fetch-depth: 1
          persist-credentials: false

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r _engine/requirements.txt

      - name: Fetch Private Production Model Checkpoints (model-v1)
        env:
          GH_TOKEN: ${{ secrets.TIGERNET_PRIVATE_TOKEN }}
        run: |
          echo "Downloading production checkpoints from private release 'model-v1'..."
          mkdir -p _engine/checkpoints
          gh release download model-v1 \
            --repo "Kingramy/tigernet" \
            --pattern "best_unet_night_800.pth" \
            --pattern "best_unet_day_800.pth" \
            --dir _engine/checkpoints

      - name: Retrieve Private Persistent Operational State
        uses: actions/checkout@v7
        with:
          repository: Kingramy/tigernet
          ref: runtime-state
          token: ${{ secrets.TIGERNET_STATE_TOKEN }}
          path: _state
          fetch-depth: 1
          persist-credentials: true

      - name: Execute Operational Surveillance Cycle
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: |
          python _engine/worker.py \
            --mode once \
            --checkpoints-dir _engine/checkpoints \
            --state-dir _state \
            --web-data-dir web/data

      - name: Persist Updated Private Operational State
        run: |
          echo "Persisting updated operational state to private tigernet:runtime-state..."
          cd _state
          git config user.name "Tigernet State Bot"
          git config user.email "state-bot@tigernet.internal"
          
          git add -A
          if git diff --staged --quiet; then
            echo "No operational state changes to commit."
          else
            git commit -m "chore(state): update operational telemetry [skip ci]"
            git push origin runtime-state
          fi
          cd ..

      - name: Strict Privacy Cleanup (Purge Engine, State & Checkpoints)
        if: always()
        run: |
          echo "Sanitizing runner workspace: purging private source code, private state, and model weights..."
          rm -rf _engine _state
          find . -name "*.pth" -type f -delete
          find . -name "*.jsonl" -type f -delete
          find . -name "*.npz" -type f -delete
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "Workspace sanitized. Proprietary IP and operational logs remain strictly protected."

      - name: Commit and Push Public Web Observation Updates
        run: |
          git config user.name "Tigernet Surveillance Bot"
          git config user.email "surveillance-bot@tigernet.internal"
          
          # Stage ONLY sanitized public web map data
          git add web/data/fires.geojson web/data/latest_status.json
          
          if git diff --staged --quiet; then
            echo "No public web data changes to commit."
          else
            git commit -m "chore(telemetry): update live wildfire observations [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'web'

  deploy:
    name: Deploy Live Map to GitHub Pages
    needs: surveillance
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
