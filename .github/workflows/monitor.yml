name: Tigernet Algeria Live Surveillance

on:
  push:
    branches:
      - main
  schedule:
    # Watchdog fallback in case autonomous chaining stops
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tigernet-runner-surveillance-pipeline
  cancel-in-progress: false

jobs:
  surveillance:
    name: Run Satellite Surveillance Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read

    steps:
      - name: Checkout Public Runner Repository
        uses: actions/checkout@v7

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Secrets Configuration
        env:
          TIGERNET_PRIVATE_TOKEN: ${{ secrets.TIGERNET_PRIVATE_TOKEN }}
          TIGERNET_STATE_TOKEN: ${{ secrets.TIGERNET_STATE_TOKEN }}
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: |
          MISSING=""
          if [ -z "$TIGERNET_PRIVATE_TOKEN" ]; then
            MISSING="${MISSING} TIGERNET_PRIVATE_TOKEN"
          fi
          if [ -z "$TIGERNET_STATE_TOKEN" ]; then
            MISSING="${MISSING} TIGERNET_STATE_TOKEN"
          fi
          if [ -z "$EUMETSAT_CONSUMER_KEY" ]; then
            MISSING="${MISSING} EUMETSAT_CONSUMER_KEY"
          fi
          if [ -z "$EUMETSAT_CONSUMER_SECRET" ]; then
            MISSING="${MISSING} EUMETSAT_CONSUMER_SECRET"
          fi
          
          if [ -n "${MISSING}" ]; then
            echo "::error::Missing required repository secrets:${MISSING}."
            echo "Please configure the missing secrets in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required secret references are securely present."

      - name: Securely Retrieve Private Inference Engine
        uses: actions/checkout@v7
        with:
          repository: Kingramy/tigernet
          ref: main
          token: ${{ secrets.TIGERNET_PRIVATE_TOKEN }}
          path: _engine
          fetch-depth: 1
          persist-credentials: false

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r _engine/requirements.txt

      - name: Fetch Private Production Model Checkpoints (model-v1)
        env:
          RAW_TOKEN: ${{ secrets.TIGERNET_PRIVATE_TOKEN }}
        run: |
          CLEAN_TOKEN=$(echo -n "$RAW_TOKEN" | tr -d '\r\n[:space:]' | sed -e 's/^Bearer//' -e 's/^token//')
          echo "Downloading production checkpoints from private release 'model-v1'..."
          mkdir -p _engine/checkpoints
          GH_TOKEN="$CLEAN_TOKEN" gh release download model-v1 \
            --repo "Kingramy/tigernet" \
            --pattern "best_unet_night_800.pth" \
            --pattern "best_unet_day_800.pth" \
            --dir _engine/checkpoints

      - name: Retrieve Private Persistent Operational State
        uses: actions/checkout@v7
        with:
          repository: Kingramy/tigernet
          ref: runtime-state
          token: ${{ secrets.TIGERNET_STATE_TOKEN }}
          path: _state
          fetch-depth: 1
          persist-credentials: true

      - name: Execute Operational Surveillance Cycle
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: |
          python _engine/worker.py \
            --mode once \
            --checkpoints-dir _engine/checkpoints \
            --state-dir _state \
            --web-data-dir web/data

      - name: Persist Updated Private Operational State
        run: |
          echo "Persisting updated operational state to private tigernet:runtime-state..."
          cd _state
          git config user.name "Tigernet State Bot"
          git config user.email "state-bot@tigernet.internal"
          
          mkdir -p /tmp/state_backup
          cp active_incidents.jsonl /tmp/state_backup/ 2>/dev/null || true
          cp industrial_hotspots.jsonl /tmp/state_backup/ 2>/dev/null || true
          cp temporal_state.npz /tmp/state_backup/ 2>/dev/null || true

          for attempt in 1 2 3 4 5; do
            git fetch origin runtime-state
            git reset --hard origin/runtime-state
            cp /tmp/state_backup/* . 2>/dev/null || true
            git add -A
            if git diff --staged --quiet; then
              echo "No operational state changes to commit."
              break
            fi
            git commit -m "chore(state): update operational telemetry [skip ci]"
            git push origin HEAD:runtime-state && break || sleep 3
          done
          rm -rf /tmp/state_backup
          cd ..

      - name: Strict Privacy Cleanup (Purge Engine, State & Checkpoints)
        if: always()
        run: |
          echo "Sanitizing runner workspace: purging private source code, private state, and model weights..."
          rm -rf _engine _state
          find . -name "*.pth" -type f -delete
          find . -name "*.jsonl" -type f -delete
          find . -name "*.npz" -type f -delete
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "Workspace sanitized. Proprietary IP and operational logs remain strictly protected."

      - name: Commit and Push Public Web Observation Updates
        run: |
          git config user.name "Tigernet Surveillance Bot"
          git config user.email "surveillance-bot@tigernet.internal"
          
          mkdir -p /tmp/web_backup
          cp web/data/fires.geojson /tmp/web_backup/
          cp web/data/latest_status.json /tmp/web_backup/
          
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/web_backup/fires.geojson web/data/fires.geojson
            cp /tmp/web_backup/latest_status.json web/data/latest_status.json
            git add web/data/fires.geojson web/data/latest_status.json
            if git diff --staged --quiet; then
              echo "No public web data changes to commit."
              break
            fi
            git commit -m "chore(telemetry): update live wildfire observations [skip ci]"
            git push origin HEAD:main && break || sleep 3
          done
          rm -rf /tmp/web_backup

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'web'

  deploy:
    name: Deploy Live Map to GitHub Pages
    needs: surveillance
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  chain-cycle:
    name: Autonomous Surveillance Chaining
    needs: [surveillance, deploy]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Drain Queue and Purge Historical Runs
        env:
          RAW_TOKEN: ${{ secrets.TIGERNET_PRIVATE_TOKEN }}
        run: |
          CLEAN_TOKEN=$(echo -n "$RAW_TOKEN" | tr -d '\r\n[:space:]' | sed -e 's/^Bearer//' -e 's/^token//')
          CURRENT_RUN_ID="${{ github.run_id }}"
          
          # Cancel any accumulated queued backlog runs to instantly drain the pipeline
          echo "Draining excess queued runs..."
          GH_TOKEN="$CLEAN_TOKEN" gh run list \
            --workflow=monitor.yml \
            --repo Kingramy/tigernet-runner \
            --status=queued \
            --limit=50 \
            --json databaseId \
            -q '.[].databaseId' | while read -r q_id; do
              if [ -n "$q_id" ] && [ "$q_id" != "$CURRENT_RUN_ID" ]; then
                echo "Cancelling excess queued run: $q_id"
                GH_TOKEN="$CLEAN_TOKEN" gh run cancel "$q_id" --repo Kingramy/tigernet-runner || true
              fi
          done

          echo "Purging old finished workflow runs to keep Actions history clean..."
          GH_TOKEN="$CLEAN_TOKEN" gh run list \
            --workflow=monitor.yml \
            --repo Kingramy/tigernet-runner \
            --limit=50 \
            --json databaseId,status \
            -q '.[] | select((.status == "completed" or .status == "cancelled") and .databaseId != '"$CURRENT_RUN_ID"') | .databaseId' | while read -r old_id; do
              if [ -n "$old_id" ]; then
                echo "Deleting finished run: $old_id"
                GH_TOKEN="$CLEAN_TOKEN" gh run delete "$old_id" --repo Kingramy/tigernet-runner || true
              fi
          done
          echo "Finished runs history purged successfully."

      - name: Delay and Dispatch Next Surveillance Cycle
        env:
          RAW_TOKEN: ${{ secrets.TIGERNET_PRIVATE_TOKEN }}
        run: |
          CLEAN_TOKEN=$(echo -n "$RAW_TOKEN" | tr -d '\r\n[:space:]' | sed -e 's/^Bearer//' -e 's/^token//')
          echo "Previous surveillance cycle completed."
          
          # Check if another run is already queued or waiting in the runner
          echo "Checking runner queue status..."
          QUEUED_RUNS=$(GH_TOKEN="$CLEAN_TOKEN" gh run list \
            --workflow=monitor.yml \
            --repo Kingramy/tigernet-runner \
            --status=queued \
            --limit=30 \
            --json databaseId \
            -q '.[].databaseId' || true)

          if [ -n "$QUEUED_RUNS" ]; then
            echo "A surveillance run is already queued in the runner ($QUEUED_RUNS)."
            echo "Skipping self-dispatch to prevent runner pileup."
          else
            echo "Entering 2-minute standby to match true 5-minute satellite pass cadence..."
            sleep 120
            echo "Dispatching next autonomous surveillance cycle..."
            GH_TOKEN="$CLEAN_TOKEN" gh workflow run monitor.yml --repo Kingramy/tigernet-runner --ref main || \
            curl -f -s -X POST \
              -H "Authorization: Bearer $CLEAN_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/Kingramy/tigernet-runner/actions/workflows/monitor.yml/dispatches \
              -d '{"ref":"main"}' || \
            echo "Notice: Chaining dispatch completed or handled by fallback triggers."
          fi
          sleep 5
